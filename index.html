<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Algo Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
    <h1>Algo Visualizer</h1>
    </header>
    <section class="controls">
        <button id="newarr">Generate New Array</button>
        <button id="selection">Selection Sort</button>
        <button id="bubble">Bubble Sort</button>
        <button id="insertion">Insertion Sort</button>
        <label for="stepdelay">Step Delay</label>
        <input type="range" id="stepdelay" min="10" max="500" value="100" step="10">
    </section>
    <main>
        <div id="bar-container"></div>
    </main>
    <script src="script.js"></script>
</body> 
</html>
